<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Carta Credito</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-image: url(immagini/sfondoScritta2.jpeg);
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed; 
            background-position: center center;
        }

        #cartaCredito {
            font-family: "Arial", sans-serif;
            text-align: center;
            justify-content: center;
            width: 20%;
            height: 45%;
            color: white;
            background-color: black;
            border-radius: 20px 20px 20px 20px;
            position: absolute;
            margin-top: 10%;
            margin-left: 40%;
        }

        .navContainer {
            padding: 5px 5px 5px 5px;
        }

        .navbar {
            text-align: center;
            background-color: black;
            padding: 10px;
            color: white;
        }

        .navbar .btn {
            overflow: hidden;
            background-color: black;
            color: white;
        }

        .navbar img {
            border-radius: 30%;
        }


        .user-profile {
            text-align: right;
            margin: auto;
        }

        .user-profile img {
            flex: 1;
            margin-right: 40px;
            text-align: right;
            border-radius: 20%;
        }
    </style>

    <!--Link bootstrap-->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
          <label>Marvel Heroes</label>
          <button class="btn btn-secondary" onclick="home()">Home</button>
          <button class="btn btn-secondary" onclick="album()">Album</button>
          <button class="btn btn-secondary" onclick="scambio()">Scambia Carte</button>
          <button class="btn btn-secondary" onclick="pacchetti()">Compra Pacchetti</button>
          <button class="btn btn-secondary" onclick="crediti()">Compra Crediti</button>
        </div>
    </nav>
    <form id="cartaCredito">
        <br>
        <label for="card_name">Nome del titolare della carta:</label> <br>
        <input type="text" id="card_name" name="card_name" pattern="[A-Za-z ]{1,50}" required>
        <br>

        <label for="card_number">Numero di carta di credito:</label> <br>
        <input type="text" id="card_number" name="card_number" pattern="[0-9]{13,16}" required> 
        <br> 
        
        <label for="expiration-date">Data di scadenza:</label> <br>
        <input type="month" id="expiration-date" name="expiration-date" min="2023-12" required>  
        <br>
        
        <label for="cvv">CVV:</label><br>
        <input type="text" id="cvv" name="cvv" pattern="[0-9]{3,4}" required>  
        <br>

        <button onclick="CreditCard()">Invia</button>
    </form>
    <script>
        function CreditCard() {
            var form = document.getElementById("cartaCredito");
            event.preventDefault();

            var cardHolder = document.getElementById("card_name").value;
            var cardNumber = document.getElementById("card_number").value;
            var expirationDate = document.getElementById("expiration-date").value;
            var cvv = document.getElementById("cvv").value;

            var loggedUser = localStorage.getItem("loggedInUser") // Prendo l'utente corrente         
            var users = JSON.parse(localStorage.getItem('users')); // Ottieni l'array degli utenti
            var user = users.find(user => user.username === loggedUser); // user rappresenta l'utente nell'array di users che è attualmente loggato

            // Validazione dei dati
            if (!cardHolder || !cardNumber || !expirationDate || !cvv) {
                alert("Errore");
                return;
            } else {
                // se i dati della carta sono giusti 
                // aggiungo la carta di credito all'utente corrente
                // e lo salvo nel local storage

                if (user.cartaCredito == false) {
                    user.cartaCredito = true;
                    localStorage.setItem('users', JSON.stringify(users));
                    alert("Carta di credito aggiunta con successo!");

                } else {
                    alert("Hai già aggiunto una carta di credito");
                }
                window.location.href = 'HomePage.html';
            }
        }

        function home(){
            window.location.href = 'HomePage.html'
        }

        function album() {
            window.location.href = 'Album.html'
        }

        function pacchetti(){
            window.location.href = 'Pacchetti.html'
        }

        function scambio(){
            window.location.href = 'Scambio.html'
        }

        function crediti(){
            var loggedUser = localStorage.getItem("loggedInUser") // Prendo l'utente corrente
            var users = JSON.parse(localStorage.getItem('users')) // Ottieni l'array degli utenti
            var datiUtente = users.find(user => user.username === loggedUser);
            console.log(datiUtente)
            
            if(datiUtente.cartaCredito){
                window.location.href = 'compraCrediti.html'
            }else {
                alert("Non hai ancora inserito la carta di credito, per favore inseriscila prima di passare a questa sezione")
            }
        }
    </script>
</body>
</html>

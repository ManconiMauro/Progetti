<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Scegli La Tua Carta Da Scambiare</title>
        
        <!--Link per funzioni javascript e per il file css-->
	    <link rel="stylesheet" href="ScegliCarte.css">
        <script src="ScegliCarte.js"></script>

        <!--Link di Bootstrap-->
        <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@10/dist/sweetalert2.min.css">
    
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
        <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg">
            <div class="container">
              <label>Marvel Heroes</label>
              <button class="btn btn-secondary" onclick="home()">Home</button>
              <button class="btn btn-secondary" onclick="album()">Album</button>
              <button class="btn btn-secondary" onclick="pacchetti()">Compra Pacchetti</button>
              <button class="btn btn-secondary" onclick="crediti()">Compra Crediti</button>
              <img src="immagini/avatar.jfif" onclick="mostraProfilo()" alt="Immagine Profilo" width="60" height="60">
            </div>
        </nav>
        <center class="centro"><h2 style="background-color: black; color: white;" >SELEZIONA UNA TUA CARTA DI CUI POSSIEDI 2 COPIE CHE DESIDERI SCAMBIARE</h2></center>

        <ul class="list-group" id="contenuto">
            <!-- Qui verrà generato dinamicamente il contenuto della pagina -->
            <div class="row" id="pg">
                <div id="card-pg" class="col-3 d-none">
                    <div class="card" style="width: 18rem;">
                        <h3 class="card-name">Card title</h3>
                        <img src="" class="card-img-top">
                        <div class="card-body">
                            <button onclick="cartaScelta(this.parentElement.parentElement.parentElement)" class="btn btn-primary">SCAMBIA</button>
                        </div>
                    </div>
                </div>
            </div>
        </ul>
        <div class="hide">
            <div id="profilo">
            </div>
        </div>
        <script>scegliCartaScambio()</script>
    </body>
</html>

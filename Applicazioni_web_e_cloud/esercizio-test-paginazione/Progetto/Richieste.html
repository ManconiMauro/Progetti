    <script>
        var loggedInUser = localStorage.getItem("loggedInUser");
        var scambi = JSON.parse(localStorage.getItem("scambi"))
        if (scambi.length > 0) {
            
            for (let i = 0; i < scambi.length; i++) {
                if(loggedInUser == scambi[i].destinatario){
                    richiestaScambio(scambi[i])
